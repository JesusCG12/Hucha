name: App de iPhone (Xcode)

# Comprueba que el proyecto de Xcode compila en un Mac y publica un .ipa sin firmar.
# Ese .ipa se puede instalar con Sideloadly o AltStore usando tu Apple ID.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'ios/**'
      - 'tools/android_assets.py'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar la app y las fuentes
        run: python3 tools/android_assets.py index.html ios/Hucha/Web

      - name: Compilar con Xcode
        run: |
          xcodebuild -version
          xcodebuild -project ios/Hucha.xcodeproj -target Hucha -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=1.0.${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Empaquetar el .ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Hucha.app Payload/
          zip -qry Hucha-sin-firmar.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Hucha-ipa
          path: Hucha-sin-firmar.ipa

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-v1.0.${{ github.run_number }}
          name: Hucha para iPhone 1.0.${{ github.run_number }}
          make_latest: false
          files: Hucha-sin-firmar.ipa
          body: |
            🍎 **Hucha-sin-firmar.ipa**: la app de iPhone compilada, sin firmar.

            Para instalarla sin Mac, ábrela con **Sideloadly** o **AltStore** desde tu ordenador e inicia sesión con tu Apple ID: la firman por ti.
            Con un Apple ID gratuito hay que reinstalarla cada 7 días.

            Si tienes Mac, abre `ios/Hucha.xcodeproj` en Xcode, elige tu equipo en *Signing & Capabilities* y pulsa ▶.
