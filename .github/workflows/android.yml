name: APK de Android

# Cada vez que cambia la app (index.html) o el proyecto Android, se compila el APK
# y se publica en Releases. También se puede lanzar a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'android/**'
      - 'icons/**'
      - 'tools/android_assets.py'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar la app y las fuentes
        run: python3 tools/android_assets.py index.html android/app/src/main/assets

      - name: Compilar el APK
        working-directory: android
        run: gradle assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace

      - name: Renombrar
        run: cp android/app/build/outputs/apk/release/app-release.apk Hucha.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Hucha-apk
          path: Hucha.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: Hucha para Android 1.0.${{ github.run_number }}
          make_latest: true
          files: Hucha.apk
          body: |
            📲 **Descarga `Hucha.apk`** (abajo, en *Assets*) desde tu móvil Android y ábrelo para instalarlo.

            La primera vez Android te pedirá permiso para instalar apps desde tu navegador o tu gestor de archivos: acéptalo.
            Las versiones nuevas se instalan encima sin perder tus datos.

            Cambios: ${{ github.event.head_commit.message || 'compilación manual' }}
